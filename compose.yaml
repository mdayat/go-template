services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      # POSTGRES_PORT comes from .env; DATABASE_URL and TEST_DATABASE_URL must use the same port.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 15

  # remove:worker
  # The job queue. Valkey is an open-source (BSD) fork of Redis; asynq and go-redis treat it as Redis.
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      # VALKEY_PORT comes from .env; REDIS_URL and TEST_REDIS_URL must use the same port.
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
  # remove:end

volumes:
  postgres-data:
  # remove:worker
  valkey-data:
  # remove:end
