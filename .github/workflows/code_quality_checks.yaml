name: Code Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only token: no step writes to the repository, so a compromised action or dependency can't
# either.
permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.shape }})
    runs-on: ubuntu-latest
    # A hung step (a test waiting forever) fails here instead of after GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: as is
            remove: ""
          # remove:template
          # Every shape a project can take with make remove must still pass every check, so
          # removing a part can't leave a project that doesn't build or whose tests fail.
          - shape: api only
            remove: worker
          - shape: worker only
            remove: api
          - shape: neither
            remove: api worker
          - shape: both, markers dropped
            remove: markers
          # remove:end

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Verify dependencies
        run: |
          go mod verify
          go mod verify -modfile=tools/go.mod

      # remove:template
      - name: Remove parts
        if: matrix.remove != ''
        env:
          REMOVE: ${{ matrix.remove }}
        run: for part in $REMOVE; do make remove what=$part; done
      # remove:end

      # Pinned by version and checksum, Community edition. Keep the version equal to the migrate
      # image's in the Dockerfile.
      - name: Install Atlas
        env:
          ATLAS_VERSION: v1.3.0
          ATLAS_SHA256: 10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b
        run: |
          curl -sSfL -o atlas "https://atlasbinaries.com/atlas/atlas-community-linux-amd64-$ATLAS_VERSION"
          echo "$ATLAS_SHA256  atlas" | sha256sum --check
          sudo install atlas /usr/local/bin/atlas
          atlas version

      - name: Check generated files are up to date
        run: make check-generated

      - name: Lint
        run: make lint

      - name: Check for known vulnerabilities
        run: make vuln

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          # remove:worker
          TEST_REDIS_URL: redis://localhost:6379/1
          # remove:end
        run: make test

      # Built only to prove the Dockerfile works; nothing is pushed.
      - name: Build images
        run: make image
