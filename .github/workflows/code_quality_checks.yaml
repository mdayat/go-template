name: Code Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only token: no step writes to the repository, so a compromised action or dependency can't
# either. Actions are pinned by commit, not tag: a tag can be moved to other code, a commit can't
# (Dependabot updates both the commit and the version comment).
permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.shape }})
    runs-on: ubuntu-latest
    # A hung step (a test waiting forever) fails here instead of after GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: as is
            remove: ""
          # remove:template
          # Every shape a project can take with make remove must still pass every check, so
          # removing a part can't leave a project that doesn't build or whose tests fail.
          - shape: api only
            remove: worker
          - shape: worker only
            remove: api
          - shape: neither
            remove: api worker
          - shape: both, markers dropped
            remove: markers
          # remove:end

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Verify dependencies
        run: |
          go mod verify
          go mod verify -modfile=tools/go.mod

      # remove:template
      - name: Remove parts
        if: matrix.remove != ''
        env:
          REMOVE: ${{ matrix.remove }}
        run: for part in $REMOVE; do make remove what=$part; done
      # remove:end

      - name: Check versions pinned in two places agree
        run: make check-versions

      # Pinned by version and checksum, Community edition. Keep the version equal to the migrate
      # image's in the Dockerfile (make check-versions compares them).
      - name: Install Atlas
        env:
          ATLAS_VERSION: v1.3.0
          ATLAS_SHA256: 10d7913e3dce43ab99b8d71534a4cbadaf11a16dc293adf3b91d10e83a0ac70b
        run: |
          curl -sSfL -o atlas "https://atlasbinaries.com/atlas/atlas-community-linux-amd64-$ATLAS_VERSION"
          echo "$ATLAS_SHA256  atlas" | sha256sum --check
          sudo install atlas /usr/local/bin/atlas
          atlas version

      - name: Check generated files are up to date
        run: make check-generated

      # Only migrations new since the commit before the push, or a pull request's base, are checked:
      # that commit is fetched to compare with (none on a repository's first push).
      - name: Check new migrations are safe while the old app runs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE//0/}" ]; then git fetch --no-tags --depth=1 origin "$BASE"; fi
          make migrate-check base="$BASE"

      - name: Lint
        run: make lint

      - name: Check for known vulnerabilities
        run: make vuln

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          # remove:valkey
          TEST_REDIS_URL: redis://localhost:6379/1
          # remove:end
        run: make test

      # Pinned by version and checksum, like Atlas, not run through Trivy's own GitHub Action, whose
      # version tags were once moved to malicious code. Dependabot doesn't track it: update by hand.
      # Only in the full shape: every other shape's images are among its, and each scan downloads
      # Trivy's list of known holes.
      - name: Install Trivy
        if: matrix.remove == ''
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      # Built to prove the Dockerfile works, and scanned; nothing is pushed.
      - name: Build and scan images
        if: matrix.remove == ''
        run: make scan

      - name: Build images
        if: matrix.remove != ''
        run: make image

      - name: Run the migrate and one-off images
        run: make check-images
