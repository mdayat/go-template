version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # style and naming
    - revive
    - gocritic
    - misspell
    - modernize
    - unconvert
    - usestdlibvars
    - wastedassign
    - copyloopvar
    # design rules
    - ireturn # return concrete types, not our own interfaces (stdlib ones like error are allowed)
    - nakedret # no blank returns in functions that return values
    - nonamedreturns # named results only when a deferred func changes the error
    - gochecknoinits # avoid init()
    - gochecknoglobals # no mutable package-level variables
    - forcetypeassert # type assertions use the comma-ok form
    - containedctx # never store a context.Context in a struct
    - exhaustive # switches over enums handle every value
    # errors
    - errorlint
    - errname
    - nilerr
    - nilnesserr
    # HTTP, database, logging
    - bodyclose
    - noctx
    - rowserrcheck # rows.Err() checked after a row loop (needs the pgx packages below)
    - zerologlint # zerolog events that are never sent
    - musttag
    # security
    - gosec
    # tests
    - usetesting
    - thelper
    - tparallel
    # keeps //nolint honest
    - nolintlint
    # libraries that may be replaced stay inside their one package
    - depguard
    # Go's default HTTP client, which has no time limit
    - forbidigo

  settings:
    depguard:
      rules:
        json-library:
          files:
            - $all
            - "!**/internal/json/*.go"
          deny:
            - pkg: github.com/goccy/go-json
              desc: use internal/json, the one package that picks the JSON library
        stdlib-json:
          # Tests may use encoding/json: parsing replies with the standard library checks they're
          # plain JSON whatever library wrote them.
          files:
            - $all
            - "!$test"
            - "!**/internal/json/*.go"
          deny:
            - pkg: encoding/json
              desc: use internal/json, the one package that picks the JSON library
        database-driver:
          # Tests may use pgx to seed and read rows. startup opens the pool, testdb makes the test
          # databases, and internal/db is generated.
          files:
            - $all
            - "!$test"
            - "!**/internal/db/*.go"
            - "!**/internal/postgres/*.go"
            - "!**/internal/startup/*.go"
            - "!**/internal/testdb/*.go"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: recognise database errors through internal/postgres; map pgtype types to Go types in sqlc.yaml
        telemetry-sdk:
          # Code that records metrics or traces takes the metric.MeterProvider and
          # trace.TracerProvider cmd/ passes in; only telemetry builds them (and metrictest and
          # spantest, for tests). Never OpenTelemetry's global providers: hidden state that parallel
          # tests would share.
          files:
            - $all
            - "!$test"
            - "!**/internal/telemetry/*.go"
            - "!**/internal/metrictest/*.go"
            - "!**/internal/spantest/*.go"
          deny:
            - pkg: go.opentelemetry.io/otel/sdk
              desc: take the provider passed in (internal/telemetry builds it)
            - pkg: go.opentelemetry.io/otel/exporters
              desc: where telemetry goes is set by OTEL_* settings, read in internal/telemetry
            - pkg: go.opentelemetry.io/contrib/exporters
              desc: where telemetry goes is set by OTEL_* settings, read in internal/telemetry
            - pkg: go.opentelemetry.io/otel$
              desc: take the provider passed in, not OpenTelemetry's global one
        memory-limit-library:
          # Go's memory limit is set once, at start.
          files:
            - $all
            - "!**/internal/startup/*.go"
          deny:
            - pkg: github.com/KimMachineGun/automemlimit
              desc: call startup.LimitMemory from cmd/
        # remove:api
        jwt-library:
          # Tests may use it to make tokens. The test issuer signs them, also for make dev-token.
          files:
            - $all
            - "!$test"
            - "!**/internal/auth/jwks/*.go"
            - "!**/internal/authtest/*.go"
          deny:
            - pkg: github.com/golang-jwt/jwt
              desc: check tokens through the api.Authenticator that cmd/api passes in
            - pkg: github.com/MicahParks
              desc: check tokens through the api.Authenticator that cmd/api passes in
        rate-limit-library:
          files:
            - $all
            - "!$test"
            - "!**/internal/ratelimit/valkey/*.go"
          deny:
            - pkg: github.com/go-redis/redis_rate
              desc: count requests through ratelimit.Limiter
        rate-limit-implementation:
          # Only the programs pick the implementation.
          files:
            - $all
            - "!$test"
            - "!**/cmd/**/*.go"
          deny:
            - pkg: github.com/mdayat/go-template/internal/ratelimit/valkey
              desc: use the ratelimit.Limiter passed in from cmd/
        # remove:end
        # remove:valkey
        valkey-client:
          # startup opens the connections and test helper packages give tests theirs. Code built on
          # Valkey keeps it in a package named valkey.
          files:
            - $all
            - "!$test"
            - "!**/internal/startup/*.go"
            - "!**/internal/test*/*.go"
            - "!**/valkey/*.go"
          deny:
            - pkg: github.com/redis/go-redis
              desc: take the client cmd/ opens with internal/startup
        # remove:end
        # remove:worker
        queue-library:
          # Tests may use it to read what was queued; testqueue gives them helpers for it.
          files:
            - $all
            - "!$test"
            - "!**/internal/queue/valkey/*.go"
            - "!**/internal/testqueue/*.go"
          deny:
            - pkg: github.com/hibiken/asynq
              desc: queue and run jobs through internal/queue
        queue-implementation:
          # Only the programs pick the implementation. Elsewhere its asynq types would get past the
          # rule above.
          files:
            - $all
            - "!$test"
            - "!**/cmd/**/*.go"
            - "!**/internal/queue/valkey/*.go"
          deny:
            - pkg: github.com/mdayat/go-template/internal/queue/valkey
              desc: use the internal/queue types passed in from cmd/
        # remove:end
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.(Get|Head|Post|PostForm|DefaultClient|DefaultTransport)$
          pkg: ^net/http$
          msg: Go's default HTTP client has no time limit; use a client from httpclient.New
    # Without these it only checks database/sql and stays silent on pgx. (sqlclosecheck isn't
    # enabled: it doesn't catch unclosed pgx rows either way.)
    rowserrcheck:
      packages:
        - github.com/jackc/pgx/v5
        - github.com/jackc/pgx/v5/pgxpool
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    nakedret:
      max-func-lines: 0
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: strict
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gochecknoglobals
      # remove:api
      # G705 (cross-site scripting) on handler.WriteJSON: replies are always a JSON content type
      # with nosniff, never HTML. A rule, not a //nolint: G705 only fires while some handler writes
      # request data into a reply, and an unused //nolint fails the lint.
      - path: internal/api/handler/handler\.go
        linters:
          - gosec
        text: G705
      # remove:end

# Show every issue: by default a second issue on the same line, and issues past a per-linter
# cap, are hidden.
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mdayat/go-template
